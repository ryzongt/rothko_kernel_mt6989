name: Build Rothko Kernel (MT6989 GKI 6.1) — KernelSU + SUSFS

on:
  workflow_dispatch:
    inputs:
      enable_susfs:
        description: "Enable SUSFS"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      release_tag:
        description: "Release tag (e.g. v1.0). Leave empty to auto-generate."
        required: false
        default: ""

jobs:
  build:
    name: Build Kernel (KernelSU + SUSFS)
    runs-on: ubuntu-22.04
    env:
      KERNEL_DEFCONFIG: gki_defconfig
      ARCH: arm64
      SUBARCH: arm64
      ZIP_PREFIX: "Rothko-MT6989-KSU"

    steps:
      # ── 1. Checkout kernel source (ветка susfs-test) ───────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: susfs-test

      # ── 2. Install dependencies ────────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl \
            flex git kmod libelf-dev libssl-dev libncurses-dev \
            lz4 python3 python3-pip rsync unzip wget zip zstd \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang lld llvm pahole dwarves

          echo "Clang version:"
          clang --version

      # ── 3. Integrate KernelSU via setup.sh ────────────────────────
      - name: Integrate KernelSU
        run: |
          curl -sSL https://raw.githubusercontent.com/ryzongt/KernelSU/refs/heads/main/kernel/setup.sh | bash
          echo "✅ KernelSU integrated"

      # ── 4. Inject SUSFS configs into gki_defconfig ─────────────────
      - name: Inject SUSFS configs into gki_defconfig
        if: ${{ github.event.inputs.enable_susfs == 'true' }}
        run: |
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          echo "" >> ${DEFCONFIG}
          echo "# SUSFS configs" >> ${DEFCONFIG}
          echo "CONFIG_KSU_SUSFS=y"                             >> ${DEFCONFIG}
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y"                    >> ${DEFCONFIG}
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"                   >> ${DEFCONFIG}
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"                   >> ${DEFCONFIG}
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"                 >> ${DEFCONFIG}
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"                  >> ${DEFCONFIG}
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"      >> ${DEFCONFIG}
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ${DEFCONFIG}
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"               >> ${DEFCONFIG}
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y"                     >> ${DEFCONFIG}
          echo "✅ SUSFS configs injected into ${DEFCONFIG}"

      # ── 5. Make defconfig ──────────────────────────────────────────
      - name: Generate .config from defconfig
        run: |
          make O=out \
            ARCH=${{ env.ARCH }} \
            CC=clang \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            ${{ env.KERNEL_DEFCONFIG }}

      # ── 6. Build kernel ────────────────────────────────────────────
      - name: Build kernel
        run: |
          make O=out \
            ARCH=${{ env.ARCH }} \
            CC=clang \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            -j$(nproc --all) \
            Image 2>&1 | tee build.log

      # ── 7. Check build result ──────────────────────────────────────
      - name: Verify Image exists
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ Build failed — Image not found!"
            tail -80 build.log
            exit 1
          fi
          echo "✅ Image built successfully"
          ls -lh out/arch/arm64/boot/Image

      # ── 8. Clone AnyKernel3 ────────────────────────────────────────
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 --branch master \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/Image

      # ── 9. Customize anykernel.sh ──────────────────────────────────
      - name: Patch anykernel.sh for Rothko
        run: |
          cd AnyKernel3
          SUSFS_LABEL=""
          if [ "${{ github.event.inputs.enable_susfs }}" == "true" ]; then
            SUSFS_LABEL="+SUSFS"
          fi
          sed -i "s/^kernel\.string=.*/kernel.string=Rothko MT6989 KSU${SUSFS_LABEL} by ${{ github.actor }}/" anykernel.sh
          sed -i 's/^device\.name1=.*/device.name1=rothko/' anykernel.sh
          sed -i 's/^supported\.versions=.*/supported.versions=/' anykernel.sh

      # ── 10. Package AnyKernel3 zip ─────────────────────────────────
      - name: Create AnyKernel3 zip
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)

          SUSFS_SUFFIX=""
          if [ "${{ github.event.inputs.enable_susfs }}" == "true" ]; then
            SUSFS_SUFFIX="-SUSFS"
          fi

          ZIP_NAME="${{ env.ZIP_PREFIX }}${SUSFS_SUFFIX}-${BUILD_DATE}-${SHORT_SHA}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" . \
            --exclude="*.git*" \
            --exclude="*README*" \
            --exclude="*placeholder*"

          ls -lh "../${ZIP_NAME}"

      # ── 11. Upload artifacts ───────────────────────────────────────
      - name: Upload Image artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rothko-KSU-Image-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
          path: out/arch/arm64/boot/Image
          retention-days: 7

      - name: Upload AnyKernel3 zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rothko-KSU-AnyKernel3-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 7

      # ── 12. Determine release tag ──────────────────────────────────
      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=ksu-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}" >> $GITHUB_OUTPUT
          fi

      # ── 13. Create GitHub Release ──────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Rothko MT6989 KSU — ${{ env.BUILD_DATE }}"
          body: |
            ## Rothko Kernel (MT6989 / Dimensity 9300) — KernelSU Build

            **Build date:** ${{ env.BUILD_DATE }}
            **Commit:** [`${{ env.SHORT_SHA }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            **KernelSU:** [ryzongt/KernelSU](https://github.com/ryzongt/KernelSU)
            **SUSFS:** `${{ github.event.inputs.enable_susfs }}`
            **Defconfig:** `${{ env.KERNEL_DEFCONFIG }}`
            **Triggered by:** @${{ github.actor }}

            ### Files
            | File | Description |
            |------|-------------|
            | `Image` | Raw kernel image |
            | `${{ env.ZIP_NAME }}` | AnyKernel3 flashable zip |

            ### How to flash
            - **AnyKernel3 zip** → flash via TWRP или [KernelFlasher](https://github.com/capntrips/KernelFlasher)
            - **Image** → pack manually with `mkbootimg`

            > ⚠️ Clean flash recommended. Wipe dalvik/cache after flashing.
          files: |
            out/arch/arm64/boot/Image
            ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 14. Upload build log on failure ───────────────────────────
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed
          path: build.log
          retention-days: 3
